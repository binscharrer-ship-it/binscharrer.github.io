<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="mobile-manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <title>慈湖工会移动端</title>
    <link rel="stylesheet" href="mobile.css" />
  </head>
  <body>
    <section class="mobile-login" id="mobile-login">
      <div class="mobile-login-card">
        <div class="mobile-logo">慈</div>
        <h1>慈湖工会移动端</h1>
        <p>部门协作、节点复盘、汇款催办和人员落实</p>
        <form id="mobile-login-form">
          <label>用户名<input name="username" autocomplete="username" required /></label>
          <label>密码<input name="password" type="password" autocomplete="current-password" required /></label>
          <button type="submit">登录</button>
        </form>
        <button class="mobile-text-button" id="mobile-register-toggle">使用部门邀请码注册</button>
        <form id="mobile-register-form" class="hidden">
          <label>部门邀请码<input name="invite_code" required /></label>
          <label>姓名<input name="display_name" required /></label>
          <label>登录用户名<input name="username" required /></label>
          <label>密码<input name="password" type="password" minlength="8" required /></label>
          <button type="submit">注册并登录</button>
        </form>
        <p class="mobile-login-note" id="mobile-login-note">仅限授权用户使用</p>
        <div class="mobile-legal">
          <span>备案/许可证编号：<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">皖ICP备2026032692号</a></span>
          <span>开发公司：XG科技公司</span>
        </div>
      </div>
    </section>

    <div class="mobile-shell hidden" id="mobile-shell">
      <header class="mobile-header">
        <div>
          <span id="mobile-department">区总工会</span>
          <strong id="mobile-title">工作台</strong>
        </div>
        <button class="mobile-avatar" id="mobile-avatar">我</button>
      </header>

      <main class="mobile-main" id="mobile-content"></main>

      <nav class="mobile-tabbar" aria-label="移动端导航">
        <button class="active" data-mobile-tab="home"><span>首页</span><small>总览</small></button>
        <button data-mobile-tab="snapshot"><span>节点</span><small>复盘</small></button>
        <button data-mobile-tab="payments"><span>汇款</span><small>到账</small></button>
        <button data-mobile-tab="people"><span>人员</span><small>落实</small></button>
        <button data-mobile-tab="me"><span>我的</span><small>设置</small></button>
      </nav>
    </div>

    <div class="mobile-install" id="mobile-install" hidden>
      <div><strong>安装到手机桌面</strong><span>像 App 一样全屏打开</span></div>
      <button id="mobile-install-button">立即安装</button>
    </div>

    <div class="mobile-toast" id="mobile-toast"></div>
    <script src="assets/static-demo.js"></script>
    <script src="assets/mobile.js"></script>
  </body>
</html>
