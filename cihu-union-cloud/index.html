<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <title>慈湖高新区机关工会云平台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="login-shell" id="login-view">
      <div class="login-panel">
        <div class="login-brand">
          <span class="brand-mark">慈</span>
          <div>
            <strong>慈湖高新区机关工会云平台</strong>
            <span>多部门协作 · 分权访问 · 数据隔离</span>
          </div>
        </div>
        <div class="login-tabs" role="tablist">
          <button class="login-tab active" data-login-tab="login">账号登录</button>
          <button class="login-tab" data-login-tab="register">邀请码注册</button>
        </div>
        <form class="login-form" id="login-form">
          <div class="field">
            <label for="login-username">用户名</label>
            <input class="input" id="login-username" name="username" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="login-password">密码</label>
            <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button class="button primary login-submit" type="submit">安全登录</button>
          <p class="login-note" id="login-note">仅限授权的区总工会、部门管理员和会员使用。</p>
        </form>
        <form class="login-form hidden" id="register-form">
          <div class="field">
            <label for="register-code">部门邀请码</label>
            <input class="input" id="register-code" name="invite_code" required />
          </div>
          <div class="field">
            <label for="register-name">姓名</label>
            <input class="input" id="register-name" name="display_name" required />
          </div>
          <div class="field">
            <label for="register-username">登录用户名</label>
            <input class="input" id="register-username" name="username" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="register-password">密码（至少8位）</label>
            <input class="input" id="register-password" name="password" type="password" minlength="8" autocomplete="new-password" required />
          </div>
          <button class="button primary login-submit" type="submit">验证邀请码并注册</button>
          <p class="login-note">邀请码由区总工会或本部门管理员签发，不开放公开注册。</p>
        </form>
      </div>
      <div class="login-aside">
        <div class="login-aside-content">
          <span class="badge green">生产架构</span>
          <h1>把复盘、汇款和人员落实放进同一套台账</h1>
          <p>节点总结自动归纳完成、进行中和未启动任务；银行汇款失败自动进入高优催办；人员全景快速识别应做未做。</p>
          <div class="login-feature-grid">
            <div><strong>三级权限</strong><span>区总、部门、会员</span></div>
            <div><strong>部门隔离</strong><span>查询强制注入部门范围</span></div>
            <div><strong>敏感加密</strong><span>卡号仅显示尾号</span></div>
            <div><strong>PWA</strong><span>手机可添加到桌面</span></div>
          </div>
        </div>
      </div>
    </section>

    <div class="app-shell hidden" id="cloud-app">
      <aside class="sidebar" id="cloud-sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">慈</div>
          <div>
            <strong>慈湖高新区</strong>
            <span>机关工会云平台</span>
          </div>
        </div>
        <nav class="nav" id="cloud-nav" aria-label="主导航"></nav>
        <div class="sidebar-foot">
          <span class="storage-dot"></span>
          <div>
            <strong id="session-user">未登录</strong>
            <span id="session-department">-</span>
          </div>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <button class="mobile-menu" data-cloud-action="toggle-menu">菜单</button>
          <div class="topbar-title">
            <span id="cloud-org">慈湖高新区机关工会</span>
            <strong id="cloud-page-title">工作台</strong>
          </div>
          <div class="topbar-actions">
            <label class="year-picker">
              <span>年度</span>
              <select id="cloud-year"></select>
            </label>
            <button class="button ghost" data-cloud-action="logout">退出登录</button>
          </div>
        </header>
        <main class="main-content" id="cloud-content"></main>
      </div>
    </div>

    <dialog class="dialog" id="cloud-dialog"></dialog>
    <div class="toast-region" id="cloud-toast"></div>
    <script src="assets/static-demo.js"></script>
    <script src="assets/app.js?v=5"></script>
  </body>
</html>
